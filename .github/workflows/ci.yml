name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:imports
      - run: npm run check:licenses
      - run: npm test
      - run: npm run build
      - run: npm run check:size

  other-time-zones:
    # Results must not depend on the machine's time zone.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [Asia/Jerusalem, America/New_York, Pacific/Chatham]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}
