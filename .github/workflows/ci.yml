name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:imports
      - run: npm run check:licenses
      - run: npm run build
      - run: npm test
      - run: npm run check:size

  other-time-zones:
    # Results must not depend on the machine's time zone.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tz: [Asia/Jerusalem, America/New_York, Pacific/Chatham]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.tz }}

  zmanim-full-oracle:
    # Every day of 2025–2028 in 19 cities against kosher-zmanim (about 3 minutes).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/zmanim.oracle.test.ts
        env:
          FULL_ORACLE: '1'

  hermes:
    # React Native's engine. The CLI VM has no Intl, so the test uses fixed-offset zones.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download Hermes CLI
        run: |
          curl -sSL -o hermes.tgz https://github.com/facebook/hermes/releases/download/v0.13.0/hermes-cli-linux.tar.gz
          mkdir -p "$RUNNER_TEMP/hermes" && tar xzf hermes.tgz -C "$RUNNER_TEMP/hermes"
      - run: npm run test:hermes
        env:
          HERMES_BIN: ${{ runner.temp }}/hermes/hermes

  deno-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx -y bun@1 test/runtimes/smoke.mjs
      - run: npx -y deno@2 run --allow-read test/runtimes/smoke.mjs
