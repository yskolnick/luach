name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:licenses
      - run: npm run check:size
      - run: npm run test:hermes

  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:oracle

  runtimes:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/smoke.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read scripts/smoke.mjs
      - run: node scripts/smoke.mjs && node scripts/smoke.cjs
      - run: npx playwright-core install --with-deps chromium && node scripts/smoke-browser.mjs
      - run: node dist/cli.js date 2026-10-21 --city Lakewood
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/smoke.mjs && node scripts/smoke.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: node scripts/smoke.mjs && node scripts/smoke.cjs

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
