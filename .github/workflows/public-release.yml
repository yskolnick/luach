name: Release

# Tags a version that is on npm and makes its GitHub release, with that version's section of
# CHANGELOG.md as the notes. Runs only in the public repository.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version on npm (e.g. 0.2.0)'
        required: true
      ref:
        description: 'The commit or branch to tag'
        required: true
        default: main

permissions:
  contents: write # to create the tag and the release

jobs:
  release:
    if: github.repository == 'yskolnick/luach'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
      - name: The version is on npm
        env:
          VERSION: ${{ inputs.version }}
        run: '[ "$(npm view "luach@$VERSION" version)" = "$VERSION" ]'
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in *[!0-9A-Za-z.+-]*|'') echo "not a version: $VERSION"; exit 1;; esac
          awk -v v="## $VERSION " 'index($0, v) == 1 { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md > notes.md
          [ -s notes.md ]
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "$VERSION" \
            --notes-file notes.md
